<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tuoniverse logo: a smiling yellow planet with a graduation cap and a ring" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="200" height="200" rx="44" fill="#1A1226"/>
  <!-- sparkles -->
  <g fill="#FFD166">
    <path transform="translate(168 36)" d="M0-11Q0 0 11 0Q0 0 0 11Q0 0-11 0Q0 0 0-11Z"/>
    <path transform="translate(38 168) scale(.7)" d="M0-11Q0 0 11 0Q0 0 0 11Q0 0-11 0Q0 0 0-11Z"/>
  </g>
  <circle cx="30" cy="62" r="3" fill="#FFF4DC"/><circle cx="176" cy="150" r="3" fill="#FFF4DC"/><circle cx="62" cy="24" r="2.5" fill="#4FD1C5"/>
  <g transform="rotate(-20 100 108)">
    <!-- ring, back half -->
    <path d="M22 108A78 20 0 0 1 178 108" fill="none" stroke="#4FD1C5" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- planet -->
  <circle cx="100" cy="108" r="48" fill="#FFC93C"/>
  <path d="M64 92A40 40 0 0 1 92 68" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="84" cy="110" r="7" fill="#fff"/><circle cx="116" cy="110" r="7" fill="#fff"/>
  <circle cx="86" cy="112" r="3.5" fill="#1A1226"/><circle cx="118" cy="112" r="3.5" fill="#1A1226"/>
  <circle cx="72" cy="126" r="6" fill="#FF8FB1" fill-opacity=".75"/><circle cx="128" cy="126" r="6" fill="#FF8FB1" fill-opacity=".75"/>
  <path d="M90 125Q100 137 110 125" fill="none" stroke="#1A1226" stroke-width="4.5" stroke-linecap="round"/>
  <g transform="rotate(-20 100 108)">
    <!-- ring, front half -->
    <path d="M22 108A78 20 0 0 0 178 108" fill="none" stroke="#4FD1C5" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- graduation cap (violet, so it shows on the plum tile) -->
  <path d="M78 58v12q22 11 44 0V58z" fill="#6B4EE0"/>
  <path d="M100 36L148 54L100 72L52 54Z" fill="#8B6DFF"/>
  <path d="M100 54L140 58V76" fill="none" stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="140" cy="79" r="5" fill="#FFC93C"/>
  <!-- flashcard -->
  <g transform="translate(150 156) rotate(12)">
    <rect x="-20" y="-14" width="40" height="28" rx="6" fill="#fff"/>
    <path d="M-8 0L-2 6L9 -6" fill="none" stroke="#1F8A5B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
